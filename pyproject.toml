[tool.poetry]
name = "SynPopToolbox"
version = "24.1.113"
description = "Synthetic Population Toolbox"
authors = ["davi.guggisberg@sbb.ch"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11, <3.12.0"
geopandas = ">=0.14,<1.2"
shapely = "^2.0.2"
pandas = "^2"
numpy = "^1.26.1"
matplotlib = "3.8.0"
pyarrow = "<16"
fastparquet = "^2023.8"
requests = "^2.28.1"
seaborn = "^0.13.1"
pyyaml = "^6.0.1"
altair = "^4"
ipyaggrid = "^0.5.1"
pyaxis = "^0.3.4"
voila = "^0.3"
jupytext = "^1.16.1"
jupyter-book = "^0.12"
ipympl = "^0.9.3"
click = "^8.1.3"
ipywidgets = "<8"
ipython = "<9"
markdown = "^3.5.2"
altair-viewer = "^0.4.0"
streamlit = "^1.37.0"        
streamlit-aggrid = "^1.0.5"  
lxml = {extras = ["html-clean"], version = "^5.4.0"}
openpyxl = "^3.1.5"

[[tool.poetry.packages]]
include = "synpop"
from = "src"

[tool.poetry.scripts]
synpop = "synpop.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
